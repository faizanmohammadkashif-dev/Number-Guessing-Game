<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Guess the Number</h1>

    <div id="playerOne">
        <input id="inputOne" type="password" placeholder="Enter a number">
        <button onclick="playerOneNumber()">Submit</button>
    </div>
    <br><br>
    <div id="playerTwo">
        <input id="inputTwo" type="number" placeholder="Guess a number">
        <button onclick="playerTwoNumber()">Check</button>
    </div>

    <p id="result"></p>

    <script src="./script.js"></script>
</body>

</html>
